name: Recuento mensual

# Una pasada al mes. El Catastro publica sus ficheros INSPIRE unas pocas veces al año y el
# SNCZI cambia aún menos: solo se recuentan los municipios cuyo fichero o mapa ha cambiado.
on:
  schedule:
    - cron: "0 4 3 * *"
  workflow_dispatch:
    inputs:
      web_only:
        description: "Solo rehacer la página con los recuentos ya guardados"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recuento
  cancel-in-progress: false

jobs:
  recuento:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      # Zone layers, ATOM feeds and boundaries. Building zips are not cached: each municipality
      # is read once and only its counts are kept, under data/counts.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      # Also on web_only: the page needs the layers. With a live cache nothing is downloaded.
      - name: Zonas inundables
        run: python -m floodbuild zones

      - name: Edificios
        if: ${{ !inputs.web_only }}
        # The manifest is saved every ten municipalities: a run cut by the time limit keeps what
        # it counted and the next one carries on.
        timeout-minutes: 300
        continue-on-error: true
        run: python -m floodbuild buildings

      # Francia: GASPAR cada semana, zonificación de los PPR, atlas y TRI de cada departamento.
      - name: Zonas inundables de Francia
        run: python -m floodbuild fr-zones

      # Solo se recuenta un departamento si cambió el millésime de la BDNB o algún mapa.
      - name: Edificios de Francia
        if: ${{ !inputs.web_only }}
        timeout-minutes: 30
        continue-on-error: true
        run: python -m floodbuild fr-buildings

      - name: Página y señales
        run: python -m floodbuild web

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/counts docs
          git diff --cached --quiet && exit 0
          git commit -m "Monthly count: $(date -u +%Y-%m)"
          git push
